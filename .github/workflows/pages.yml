name: Pages
# Run by hand from the Actions tab (Run workflow). It deploys only after every check passes.
on:
  workflow_dispatch:
# The build runs third-party code (npm ci), so only the deploy job may publish.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      # Public Google settings from the repository's Actions variables (docs/google-drive.md).
      # Without them the site is built without Google Drive.
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
      VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      # Optional GA4 measurement ID (ADR 0014); without it the site sends no usage statistics.
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
    steps:
      - name: Check Google settings
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ] || [ -z "$VITE_GOOGLE_API_KEY" ] || [ -z "$VITE_GOOGLE_APP_ID" ]; then
            echo "::warning::VITE_GOOGLE_* repository variables are not all set; the site is built without Google Drive."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes back, so the token is not left in the git config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Ends with the production build into dist/.
      - run: npm run verify
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results/e2e/
          if-no-files-found: ignore
          # Failure traces are only useful right after a run; keep storage from piling up.
          retention-days: 3
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Deployed straight away by the next job, so it need not outlive the run for long.
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
