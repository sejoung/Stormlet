name: Pages
# Run by hand from the Actions tab (Run workflow). It deploys only after every check passes.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      # Public Google settings from the repository's Actions variables (docs/google-drive.md).
      # Without them the site is built without Google Drive.
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
      VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
    steps:
      - name: Check Google settings
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ] || [ -z "$VITE_GOOGLE_API_KEY" ] || [ -z "$VITE_GOOGLE_APP_ID" ]; then
            echo "::warning::VITE_GOOGLE_* repository variables are not all set; the site is built without Google Drive."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Ends with the production build into dist/.
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: test-results/e2e/
          if-no-files-found: ignore
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
